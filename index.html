<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐱 Gato Marciano - Space Cat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0a0a1a;
        }
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            background: #0a0a1a;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
            pointer-events: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #ui span {
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        #touchControls {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
            flex-direction: column;
            gap: 15px;
            z-index: 15;
            pointer-events: none;
        }
        #touchControls button {
            pointer-events: all;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            border: 2px solid rgba(255,255,255,0.2);
            color: white;
            font-size: 28px;
            backdrop-filter: blur(4px);
            touch-action: none;
            user-select: none;
            -webkit-touch-callout: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }
        #touchControls button:active {
            transform: scale(0.9);
            background: rgba(255,255,255,0.25);
        }
        @media (max-width: 768px) {
            #touchControls { display: flex !important; }
            #ui { font-size: 14px; padding: 0 12px; top: 10px; }
            #ui span { padding: 5px 12px; }
            #touchControls button { width: 55px; height: 55px; font-size: 22px; }
        }
        @media (max-width: 480px) {
            #touchControls button { width: 48px; height: 48px; font-size: 18px; }
            #touchControls { right: 10px; gap: 10px; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <span>🐱 <span id="scoreDisplay">0</span>/100</span>
            <span>🚀 <span id="speedDisplay">10</span>x</span>
        </div>
        <div id="touchControls">
            <button id="btnUp">⬆</button>
            <button id="btnDown">⬇</button>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURACIÓN INICIAL
        // ============================================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let W, H, S;

        function resize() {
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W;
            canvas.height = H;
            S = Math.min(W / 600, H / 800);
        }
        window.addEventListener('resize', resize);
        resize();

        // ============================================================
        // SISTEMA DE SKINS Y MONEDAS
        // ============================================================
        const SKINS = [
            { id: 'verde', nombre: '🐱 Gato Verde', precio: 0, color: '#66FF88', color2: '#33CC55', color3: '#1A8C33', desbloqueado: true },
            { id: 'naranja', nombre: '🐱 Gato Naranja', precio: 500, color: '#FFA94D', color2: '#FF8C00', color3: '#CC6A00', desbloqueado: false },
            { id: 'morado', nombre: '🐱 Gato Morado', precio: 1000, color: '#B388FF', color2: '#7C4DFF', color3: '#4A148C', desbloqueado: false },
            { id: 'dorado', nombre: '🐱 Gato Dorado', precio: 1500, color: '#FFD700', color2: '#FFC107', color3: '#FF8F00', desbloqueado: false }
        ];

        let monedas = parseInt(localStorage.getItem('spaceCatMonedas')) || 0;
        let skinActual = localStorage.getItem('spaceCatSkin') || 'verde';

        // Cargar desbloqueos guardados
        SKINS.forEach(skin => {
            const key = 'spaceCatSkin_' + skin.id;
            if (localStorage.getItem(key) === 'true') {
                skin.desbloqueado = true;
            }
        });
        // Asegurar que la skin verde siempre está desbloqueada
        SKINS[0].desbloqueado = true;

        function guardarMonedas() {
            localStorage.setItem('spaceCatMonedas', String(monedas));
        }

        function guardarSkin() {
            localStorage.setItem('spaceCatSkin', skinActual);
        }

        function desbloquearSkin(id) {
            const skin = SKINS.find(s => s.id === id);
            if (!skin || skin.desbloqueado) return false;
            if (monedas < skin.precio) return false;
            monedas -= skin.precio;
            skin.desbloqueado = true;
            localStorage.setItem('spaceCatSkin_' + id, 'true');
            guardarMonedas();
            return true;
        }

        function seleccionarSkin(id) {
            const skin = SKINS.find(s => s.id === id);
            if (!skin || !skin.desbloqueado) return false;
            skinActual = id;
            guardarSkin();
            return true;
        }

        function getSkinData() {
            return SKINS.find(s => s.id === skinActual) || SKINS[0];
        }

        // ============================================================
        // ESTADO DEL JUEGO
        // ============================================================
        const juego = {
            menu: true,
            tienda: false,
            jugando: false,
            gameOver: false,
            victoria: false,
            score: 0,
            maxScore: 100,
            velocidad: 10,
            velocidadBase: 12,
            frame: 0,
            carriles: 3,
            spawnTimer: 0,
            record: parseInt(localStorage.getItem('spaceCatRecord')) || 0,
            estrellas: [],
            victoriaAnim: 0,
            doritosAnim: 0,
            naveAnim: 0,
            faseDificil: false,
            skinSeleccionada: skinActual
        };

        // ============================================================
        // CLASE GATO - CON COLORES DINÁMICOS
        // ============================================================
        class Gato {
            constructor() {
                this.carril = 1;
                this.ancho = 55 * S;
                this.alto = 65 * S;
                this.x = 80 * S;
                this.y = this.getY();
                this.animacion = 0;
                this.parpadeo = 0;
                this.colaMov = 0;
                this.patas = 0;
                this.antenaMov = 0;
                this.comiendo = false;
                this.comerAnim = 0;
                const skin = getSkinData();
                this.color1 = skin.color;
                this.color2 = skin.color2;
                this.color3 = skin.color3;
            }

            getY() {
                const espacioTotal = H - 100 * S;
                const altoCarril = espacioTotal / 3;
                return 50 * S + this.carril * altoCarril + (altoCarril - this.alto) / 2;
            }

            mover(arriba) {
                if (arriba && this.carril > 0) {
                    this.carril--;
                    this.y = this.getY();
                    crearParticulas(this.x + this.ancho / 2, this.y + this.alto / 2, this.color1, 10, 2);
                } else if (!arriba && this.carril < 2) {
                    this.carril++;
                    this.y = this.getY();
                    crearParticulas(this.x + this.ancho / 2, this.y + this.alto / 2, this.color1, 10, 2);
                }
            }

            dibujar() {
                const s = S;
                const x = this.x;
                const y = this.y;
                const w = this.ancho;
                const h = this.alto;
                const c1 = this.color1;
                const c2 = this.color2;
                const c3 = this.color3;

                this.animacion += 0.05;
                this.parpadeo += 0.03;
                this.colaMov += 0.08;
                this.patas += 0.06;
                this.antenaMov += 0.04;
                if (this.comiendo) {
                    this.comerAnim += 0.1;
                }

                ctx.save();

                ctx.shadowColor = c1 + '33';
                ctx.shadowBlur = 30 * s;

                // Cuerpo
                const gradCuerpo = ctx.createRadialGradient(x + w / 2, y + h / 2, 0, x + w / 2, y + h / 2, w);
                gradCuerpo.addColorStop(0, c1);
                gradCuerpo.addColorStop(0.6, c2);
                gradCuerpo.addColorStop(1, c3);
                ctx.fillStyle = gradCuerpo;
                ctx.beginPath();
                ctx.ellipse(x + w / 2, y + h / 2 + 8 * s, w / 2.3, h / 2.7, 0, 0, Math.PI * 2);
                ctx.fill();

                // Cabeza
                ctx.fillStyle = c1;
                ctx.beginPath();
                ctx.arc(x + w / 2, y + h / 3 + 5 * s, w / 2.5, 0, Math.PI * 2);
                ctx.fill();

                // Antenas
                const antMov = Math.sin(this.antenaMov) * 3 * s;
                ctx.strokeStyle = c2;
                ctx.lineWidth = 3 * s;
                ctx.beginPath();
                ctx.moveTo(x + w / 2 - 10 * s, y + 4 * s);
                ctx.quadraticCurveTo(x + w / 2 - 18 * s, y - 20 * s + antMov, x + w / 2 - 8 * s, y - 30 * s + antMov);
                ctx.stroke();
                ctx.fillStyle = '#FF6B6B';
                ctx.shadowColor = 'rgba(255,100,100,0.4)';
                ctx.shadowBlur = 15 * s;
                ctx.beginPath();
                ctx.arc(x + w / 2 - 8 * s, y - 30 * s + antMov, 5 * s, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowColor = c1 + '33';
                ctx.shadowBlur = 30 * s;
                ctx.strokeStyle = c2;
                ctx.lineWidth = 3 * s;
                ctx.beginPath();
                ctx.moveTo(x + w / 2 + 10 * s, y + 4 * s);
                ctx.quadraticCurveTo(x + w / 2 + 18 * s, y - 20 * s - antMov, x + w / 2 + 8 * s, y - 30 * s - antMov);
                ctx.stroke();
                ctx.fillStyle = '#FF6B6B';
                ctx.shadowColor = 'rgba(255,100,100,0.4)';
                ctx.shadowBlur = 15 * s;
                ctx.beginPath();
                ctx.arc(x + w / 2 + 8 * s, y - 30 * s - antMov, 5 * s, 0, Math.PI * 2);
                ctx.fill();

                // Orejas
                ctx.shadowBlur = 0;
                ctx.fillStyle = c2;
                ctx.beginPath();
                ctx.moveTo(x + w / 2 - 14 * s, y + 4 * s);
                ctx.lineTo(x + w / 2 - 26 * s, y - 6 * s);
                ctx.lineTo(x + w / 2 - 6 * s, y + 2 * s);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(x + w / 2 + 14 * s, y + 4 * s);
                ctx.lineTo(x + w / 2 + 26 * s, y - 6 * s);
                ctx.lineTo(x + w / 2 + 6 * s, y + 2 * s);
                ctx.fill();

                ctx.fillStyle = c1;
                ctx.beginPath();
                ctx.moveTo(x + w / 2 - 14 * s, y + 5 * s);
                ctx.lineTo(x + w / 2 - 22 * s, y - 3 * s);
                ctx.lineTo(x + w / 2 - 8 * s, y + 3 * s);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(x + w / 2 + 14 * s, y + 5 * s);
                ctx.lineTo(x + w / 2 + 22 * s, y - 3 * s);
                ctx.lineTo(x + w / 2 + 8 * s, y + 3 * s);
                ctx.fill();

                // Ojos
                const parpadeo = Math.sin(this.parpadeo * 3) > 0.9 ? 0.2 : 1;
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.ellipse(x + w / 2 - 10 * s, y + h / 3 + 6 * s, 8 * s, 9 * s * parpadeo, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(x + w / 2 + 10 * s, y + h / 3 + 6 * s, 8 * s, 9 * s * parpadeo, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#00FF88';
                ctx.shadowColor = 'rgba(0,255,136,0.3)';
                ctx.shadowBlur = 10 * s;
                const mirar = Math.sin(this.animacion * 0.5) * 3 * s;
                ctx.beginPath();
                ctx.arc(x + w / 2 - 10 * s + mirar, y + h / 3 + 8 * s, 5 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + w / 2 + 10 * s + mirar, y + h / 3 + 8 * s, 5 * s, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#0a1a0a';
                ctx.beginPath();
                ctx.arc(x + w / 2 - 10 * s + mirar + 2 * s, y + h / 3 + 9 * s, 2.5 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + w / 2 + 10 * s + mirar + 2 * s, y + h / 3 + 9 * s, 2.5 * s, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.beginPath();
                ctx.arc(x + w / 2 - 12 * s + mirar, y + h / 3 + 5 * s, 2 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + w / 2 + 8 * s + mirar, y + h / 3 + 5 * s, 2 * s, 0, Math.PI * 2);
                ctx.fill();

                // Nariz
                ctx.fillStyle = '#FF6B6B';
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.moveTo(x + w / 2, y + h / 3 + 14 * s);
                ctx.lineTo(x + w / 2 - 4 * s, y + h / 3 + 18 * s);
                ctx.lineTo(x + w / 2 + 4 * s, y + h / 3 + 18 * s);
                ctx.fill();

                // Bigotes
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 1.5 * s;
                const bigoteY = y + h / 3 + 16 * s;
                ctx.beginPath();
                ctx.moveTo(x + w / 2 - 6 * s, bigoteY);
                ctx.lineTo(x + w / 2 - 22 * s, bigoteY - 6 * s);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x + w / 2 - 6 * s, bigoteY + 2 * s);
                ctx.lineTo(x + w / 2 - 22 * s, bigoteY + 2 * s);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x + w / 2 - 6 * s, bigoteY + 4 * s);
                ctx.lineTo(x + w / 2 - 22 * s, bigoteY + 8 * s);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x + w / 2 + 6 * s, bigoteY);
                ctx.lineTo(x + w / 2 + 22 * s, bigoteY - 6 * s);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x + w / 2 + 6 * s, bigoteY + 2 * s);
                ctx.lineTo(x + w / 2 + 22 * s, bigoteY + 2 * s);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x + w / 2 + 6 * s, bigoteY + 4 * s);
                ctx.lineTo(x + w / 2 + 22 * s, bigoteY + 8 * s);
                ctx.stroke();

                // Boca
                ctx.strokeStyle = '#2E7D32';
                ctx.lineWidth = 1.5 * s;
                if (this.comiendo) {
                    ctx.fillStyle = '#2E7D32';
                    ctx.beginPath();
                    ctx.arc(x + w / 2, y + h / 3 + 20 * s, 6 * s, 0, Math.PI);
                    ctx.fill();
                    ctx.fillStyle = '#FF6B6B';
                    ctx.beginPath();
                    ctx.arc(x + w / 2 - 2 * s, y + h / 3 + 20 * s + Math.sin(this.comerAnim) * 2 * s, 3 * s, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(x + w / 2, y + h / 3 + 20 * s, 4 * s, 0.1 * Math.PI, 0.9 * Math.PI);
                    ctx.stroke();
                }

                // Patas
                const paso = Math.sin(this.patas) * 5 * s;
                ctx.fillStyle = c2;
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.roundRect(x + 4 * s, y + h / 2 + 10 * s + paso, 8 * s, 14 * s, 4 * s);
                ctx.fill();
                ctx.beginPath();
                ctx.roundRect(x + w - 12 * s, y + h / 2 + 10 * s - paso, 8 * s, 14 * s, 4 * s);
                ctx.fill();
                ctx.beginPath();
                ctx.roundRect(x + 2 * s, y + h - 12 * s + paso * 0.5, 9 * s, 12 * s, 4 * s);
                ctx.fill();
                ctx.beginPath();
                ctx.roundRect(x + w - 11 * s, y + h - 12 * s - paso * 0.5, 9 * s, 12 * s, 4 * s);
                ctx.fill();

                ctx.fillStyle = c1;
                ctx.beginPath();
                ctx.arc(x + 8 * s, y + h / 2 + 18 * s + paso, 3 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + w - 8 * s, y + h / 2 + 18 * s - paso, 3 * s, 0, Math.PI * 2);
                ctx.fill();

                // Cola
                ctx.shadowColor = c1 + '33';
                ctx.shadowBlur = 15 * s;
                ctx.fillStyle = c2;
                const colaX = x + w - 2 * s;
                const colaY = y + h / 2 + 10 * s;
                const colaAng = Math.sin(this.colaMov) * 0.4 + 0.6;
                ctx.beginPath();
                ctx.moveTo(colaX, colaY);
                ctx.quadraticCurveTo(
                    colaX + 18 * s * Math.cos(colaAng),
                    colaY - 22 * s * Math.sin(colaAng) - 5 * s,
                    colaX + 32 * s * Math.cos(colaAng + 0.3),
                    colaY - 32 * s * Math.sin(colaAng + 0.3) - 10 * s
                );
                ctx.lineWidth = 8 * s;
                ctx.lineCap = 'round';
                ctx.stroke();

                ctx.fillStyle = c1;
                ctx.beginPath();
                ctx.arc(
                    colaX + 32 * s * Math.cos(colaAng + 0.3),
                    colaY - 32 * s * Math.sin(colaAng + 0.3) - 10 * s,
                    5 * s, 0, Math.PI * 2
                );
                ctx.fill();

                // Rayas
                ctx.shadowBlur = 0;
                ctx.fillStyle = c3 + '33';
                ctx.fillRect(x + w / 2 - 12 * s, y + h / 3 + 24 * s, 24 * s, 4 * s);
                ctx.fillRect(x + w / 2 - 14 * s, y + h / 3 + 30 * s, 28 * s, 3 * s);

                ctx.restore();
            }
        }

        // ============================================================
        // CLASE OBSTÁCULO
        // ============================================================
        class Obstaculo {
            constructor(carril, tipo) {
                const s = S;
                this.carril = carril;
                this.tipo = tipo || randInt(0, 2);
                this.ancho = 28 * s;
                this.alto = 28 * s;
                this.x = W + 30 * s;
                this.y = this.getY();
                const velocidadBase = juego.faseDificil ? 16 : 12;
                this.velocidad = (velocidadBase * s + juego.velocidad * 0.8 * s);
                this.rotacion = 0;
                this.vida = true;
                this.contado = false;
                this.colores = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA94D', '#A8E6CF', '#FF6B35', '#7C4DFF'];
                this.color = this.colores[randInt(0, 6)];
                this.formas = ['meteorito', 'asteroide', 'basura', 'satelite', 'ovni'];
                this.forma = this.formas[randInt(0, 4)];
                if (Math.random() < 0.12) {
                    this.ancho *= 1.4;
                    this.alto *= 1.4;
                }
            }

            getY() {
                const espacioTotal = H - 100 * S;
                const altoCarril = espacioTotal / 3;
                return 50 * S + this.carril * altoCarril + (altoCarril - this.alto) / 2;
            }

            mover() {
                this.x -= this.velocidad;
                this.rotacion += 0.1;
                if (this.x < -60 * S) {
                    this.vida = false;
                }
            }

            dibujar() {
                const s = S;
                const x = this.x;
                const y = this.y;
                const w = this.ancho;
                const h = this.alto;

                ctx.save();
                ctx.translate(x + w / 2, y + h / 2);
                ctx.rotate(this.rotacion);

                ctx.shadowColor = 'rgba(255,200,100,0.3)';
                ctx.shadowBlur = 20 * s;

                if (this.forma === 'meteorito') {
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = 'rgba(255,200,100,0.3)';
                    ctx.shadowBlur = 20 * s;
                    ctx.beginPath();
                    const puntos = 8;
                    for (let i = 0; i < puntos; i++) {
                        const ang = (i / puntos) * Math.PI * 2;
                        const r = w / 2 * (0.7 + Math.sin(i * 2.3 + this.rotacion * 2) * 0.3);
                        if (i === 0) ctx.moveTo(Math.cos(ang) * r, Math.sin(ang) * r);
                        else ctx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = 'rgba(0,0,0,0.15)';
                    ctx.beginPath();
                    ctx.arc(-4 * s, -4 * s, 6 * s, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(6 * s, 5 * s, 4 * s, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.forma === 'asteroide') {
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = 'rgba(255,200,100,0.3)';
                    ctx.shadowBlur = 20 * s;
                    ctx.beginPath();
                    const pts = 6;
                    for (let i = 0; i < pts; i++) {
                        const ang = (i / pts) * Math.PI * 2;
                        const r = w / 2 * (0.6 + Math.sin(i * 1.7 + this.rotacion) * 0.4);
                        if (i === 0) ctx.moveTo(Math.cos(ang) * r, Math.sin(ang) * r);
                        else ctx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                    ctx.lineWidth = 1 * s;
                    ctx.stroke();
                } else if (this.forma === 'basura') {
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = 'rgba(255,200,100,0.3)';
                    ctx.shadowBlur = 20 * s;
                    ctx.fillRect(-w / 2, -h / 2, w, h);
                    ctx.fillStyle = 'rgba(255,255,255,0.1)';
                    ctx.fillRect(-w / 2 + 4 * s, -h / 2 + 4 * s, w / 2, h / 2);
                } else if (this.forma === 'satelite') {
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = 'rgba(255,200,100,0.3)';
                    ctx.shadowBlur = 20 * s;
                    ctx.fillRect(-w / 2, -h / 6, w, h / 3);
                    ctx.fillStyle = '#4ECDC4';
                    ctx.fillRect(-w / 2 - 12 * s, -h / 3, 8 * s, h * 0.8);
                    ctx.fillRect(w / 2 + 4 * s, -h / 3, 8 * s, h * 0.8);
                    ctx.strokeStyle = '#FFD93D';
                    ctx.lineWidth = 2 * s;
                    ctx.beginPath();
                    ctx.moveTo(0, -h / 6);
                    ctx.lineTo(0, -h / 2 - 12 * s);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(0, -h / 2 - 12 * s, 4 * s, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // OVNI
                    ctx.fillStyle = '#7C4DFF';
                    ctx.shadowColor = 'rgba(150,100,255,0.3)';
                    ctx.shadowBlur = 20 * s;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, w / 1.5, h / 3, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#B388FF';
                    ctx.beginPath();
                    ctx.ellipse(0, -h / 4, w / 2.5, h / 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FFD93D';
                    ctx.beginPath();
                    ctx.arc(0, -h / 4, 4 * s, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FF6B6B';
                    ctx.beginPath();
                    ctx.arc(-w / 3, 2 * s, 3 * s, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#4ECDC4';
                    ctx.beginPath();
                    ctx.arc(0, 3 * s, 3 * s, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FFD93D';
                    ctx.beginPath();
                    ctx.arc(w / 3, 2 * s, 3 * s, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.12)';
                ctx.beginPath();
                ctx.arc(-w / 4, -h / 4, w / 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            colisiona(gato) {
                const s = S;
                const gx = gato.x + gato.ancho / 2;
                const gy = gato.y + gato.alto / 2;
                const ox = this.x + this.ancho / 2;
                const oy = this.y + this.alto / 2;
                const dist = Math.hypot(gx - ox, gy - oy);
                const radioGato = Math.min(gato.ancho, gato.alto) / 2.5;
                const radioObs = Math.min(this.ancho, this.alto) / 2;
                return dist < radioGato + radioObs;
            }
        }

        // ============================================================
        // PARTÍCULAS
        // ============================================================
        let particulas = [];

        function crearParticulas(x, y, color, n = 10, vel = 3) {
            for (let i = 0; i < n; i++) {
                const a = Math.random() * Math.PI * 2;
                const v = (1 + Math.random() * vel) * S;
                particulas.push({
                    x,
                    y,
                    dx: Math.cos(a) * v,
                    dy: Math.sin(a) * v,
                    vida: 20 + Math.random() * 20,
                    maxVida: 40,
                    radio: (2 + Math.random() * 4) * S,
                    color
                });
            }
        }

        function actualizarParticulas() {
            for (let i = particulas.length - 1; i >= 0; i--) {
                const p = particulas[i];
                p.x += p.dx;
                p.y += p.dy;
                p.dy += 0.05 * S;
                p.vida--;
                if (p.vida <= 0) particulas.splice(i, 1);
            }
        }

        function dibujarParticulas() {
            for (const p of particulas) {
                const a = p.vida / p.maxVida;
                ctx.globalAlpha = a;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radio * a, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        // ============================================================
        // ESTRELLAS
        // ============================================================
        function crearEstrellas() {
            juego.estrellas = [];
            for (let i = 0; i < 150; i++) {
                juego.estrellas.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    r: 0.5 + Math.random() * 2.5,
                    brillo: 0.3 + Math.random() * 0.7,
                    velocidad: 0.2 + Math.random() * 0.8,
                    color: ['#FFFFFF', '#FFD93D', '#88CCFF', '#FF6B6B'][randInt(0, 3)]
                });
            }
        }

        function dibujarEstrellas() {
            for (const e of juego.estrellas) {
                const b = 0.5 + 0.5 * Math.sin(Date.now() / 1000 * e.velocidad + e.x);
                ctx.globalAlpha = e.brillo * b;
                ctx.fillStyle = e.color;
                ctx.shadowColor = e.color;
                ctx.shadowBlur = 5 * S;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.r * S, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        // ============================================================
        // UTILIDADES
        // ============================================================
        function rand(min, max) {
            return Math.random() * (max - min) + min;
        }

        function randInt(min, max) {
            return Math.floor(rand(min, max + 1));
        }

        // ============================================================
        // VARIABLES DEL JUEGO
        // ============================================================
        let gato = null;
        let obstaculos = [];
        let teclas = {};
        let spawnTimer = 0;
        let frameCount = 0;

        // ============================================================
        // FUNCIONES DEL JUEGO
        // ============================================================
        function reiniciarJuego() {
            const s = S;
            gato = new Gato();
            obstaculos = [];
            particulas = [];
            juego.score = 0;
            juego.velocidad = 10;
            juego.velocidadBase = 12 * s;
            juego.gameOver = false;
            juego.victoria = false;
            juego.jugando = true;
            juego.menu = false;
            juego.tienda = false;
            juego.victoriaAnim = 0;
            juego.doritosAnim = 0;
            juego.naveAnim = 0;
            juego.faseDificil = false;
            spawnTimer = 0;
            frameCount = 0;
            document.getElementById('scoreDisplay').textContent = '0';
            document.getElementById('speedDisplay').textContent = '10';
            crearEstrellas();
        }

        function spawnObstaculo() {
            const carrilesDisponibles = [];
            for (let i = 0; i < 3; i++) carrilesDisponibles.push(i);

            const maxObstaculos = juego.faseDificil ? 3 : 2;
            const numObstaculos = juego.score > 25 ? Math.min(1 + Math.floor(Math.random() * maxObstaculos), maxObstaculos) : 1;

            for (let i = 0; i < numObstaculos; i++) {
                if (carrilesDisponibles.length === 0) break;
                const idx = randInt(0, carrilesDisponibles.length - 1);
                const carril = carrilesDisponibles[idx];
                carrilesDisponibles.splice(idx, 1);
                const obs = new Obstaculo(carril);
                obstaculos.push(obs);
            }
        }

        function actualizar() {
            if (juego.menu || juego.tienda || juego.gameOver || juego.victoria || !gato) return;

            frameCount++;
            const s = S;

            // Fase difícil a partir de 80 puntos
            if (juego.score >= 80 && !juego.faseDificil) {
                juego.faseDificil = true;
                juego.velocidadBase = 16 * s;
                crearParticulas(W / 2, H / 2, '#FFD700', 50, 8);
                crearParticulas(W / 2 - 100 * s, H / 2, '#FF6B6B', 30, 6);
                crearParticulas(W / 2 + 100 * s, H / 2, '#4ECDC4', 30, 6);
            }

            // Aumentar velocidad
            const incrementoVel = juego.faseDificil ? 0.3 : 0.2;
            if (frameCount % (juego.faseDificil ? 20 : 25) === 0 && juego.velocidad < (juego.faseDificil ? 28 : 25)) {
                juego.velocidad += incrementoVel;
                document.getElementById('speedDisplay').textContent = Math.floor(juego.velocidad * 10) / 10;
            }

            // Spawn - MANTIENE DISTANCIA
            const intervaloBase = juego.faseDificil ? 18 : 25;
            const intervalo = Math.max(intervaloBase, 45 - juego.velocidad * 0.8);
            juego.spawnTimer++;
            if (juego.spawnTimer > intervalo + Math.random() * (juego.faseDificil ? 15 : 20)) {
                juego.spawnTimer = 0;
                spawnObstaculo();
            }

            // Mover obstáculos
            for (let i = obstaculos.length - 1; i >= 0; i--) {
                const obs = obstaculos[i];
                obs.mover();
                if (!obs.vida) {
                    obstaculos.splice(i, 1);
                    continue;
                }
                if (obs.colisiona(gato)) {
                    juego.gameOver = true;
                    juego.jugando = false;
                    crearParticulas(gato.x + gato.ancho / 2, gato.y + gato.alto / 2, '#FF6B6B', 30, 5);
                    return;
                }
                if (obs.x + obs.ancho < gato.x && !obs.contado) {
                    obs.contado = true;
                    juego.score++;
                    monedas++;
                    guardarMonedas();
                    document.getElementById('scoreDisplay').textContent = juego.score;
                    crearParticulas(gato.x + gato.ancho / 2, gato.y + gato.alto / 2, '#FFD700', 8, 2);
                    if (juego.score >= juego.maxScore) {
                        juego.victoria = true;
                        juego.jugando = false;
                        if (juego.score > juego.record) {
                            juego.record = juego.score;
                            localStorage.setItem('spaceCatRecord', String(juego.record));
                        }
                        return;
                    }
                }
            }

            obstaculos = obstaculos.filter(o => o.x > -100 * s);
            actualizarParticulas();

            for (const e of juego.estrellas) {
                const velEstrella = juego.faseDificil ? 0.3 : 0.2;
                e.x -= velEstrella * juego.velocidad * S;
                if (e.x < 0) e.x = W;
            }
        }

        // ============================================================
        // ANIMACIÓN DE VICTORIA
        // ============================================================
        let doritos = [];

        function crearDoritos() {
            const s = S;
            doritos = [];
            for (let i = 0; i < 40; i++) {
                doritos.push({
                    x: rand(W * 0.1, W * 0.9),
                    y: rand(H * 0.2, H * 0.8),
                    r: rand(8 * s, 22 * s),
                    color: ['#FF6B35', '#F7C948', '#FF4444', '#FF8C00', '#FFD700', '#66FF88'][randInt(0, 5)],
                    vx: rand(-1.5, 1.5) * s,
                    vy: rand(-3, -0.5) * s,
                    rot: rand(0, Math.PI * 2),
                    rotV: rand(-0.05, 0.05)
                });
            }
        }

        function dibujarVictoria() {
            const s = S;
            juego.victoriaAnim += 0.02;
            juego.doritosAnim += 0.05;
            juego.naveAnim += 0.015;

            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            ctx.fillRect(0, 0, W, H);

            // Planeta Gatito World
            const planetaX = W * 0.7;
            const planetaY = H * 0.45 + Math.sin(juego.victoriaAnim * 0.3) * 10 * s;
            const planetaR = Math.min(W, H) * 0.22;

            ctx.shadowColor = 'rgba(100,255,200,0.3)';
            ctx.shadowBlur = 60 * s;
            const gradPlaneta = ctx.createRadialGradient(planetaX - planetaR * 0.3, planetaY - planetaR * 0.3, 0, planetaX, planetaY, planetaR * 1.2);
            gradPlaneta.addColorStop(0, '#88FFAA');
            gradPlaneta.addColorStop(0.3, '#44DD66');
            gradPlaneta.addColorStop(0.7, '#1A8C33');
            gradPlaneta.addColorStop(1, '#0a4a1a');
            ctx.fillStyle = gradPlaneta;
            ctx.beginPath();
            ctx.arc(planetaX, planetaY, planetaR, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(100,255,150,0.15)';
            ctx.lineWidth = 8 * s;
            ctx.beginPath();
            ctx.ellipse(planetaX, planetaY, planetaR * 1.6, planetaR * 0.5, 0.2, 0, Math.PI * 2);
            ctx.stroke();
            ctx.strokeStyle = 'rgba(100,255,150,0.08)';
            ctx.lineWidth = 4 * s;
            ctx.beginPath();
            ctx.ellipse(planetaX, planetaY, planetaR * 1.9, planetaR * 0.4, -0.1, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255,255,255,0.05)';
            for (let i = 0; i < 8; i++) {
                const ang = i * Math.PI / 4 + juego.victoriaAnim * 0.2;
                const dist2 = planetaR * 0.6 + Math.sin(i * 1.5) * planetaR * 0.2;
                const px = planetaX + Math.cos(ang) * dist2;
                const py = planetaY + Math.sin(ang) * dist2 * 0.8;
                ctx.beginPath();
                ctx.arc(px, py, 4 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(px + 8 * s, py + 4 * s, 4 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(px - 8 * s, py + 4 * s, 4 * s, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.shadowBlur = 20 * s;
            ctx.shadowColor = 'rgba(100,255,150,0.3)';
            ctx.fillStyle = '#FFD93D';
            ctx.font = `bold ${28*s}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🐱 GATITO WORLD 🌍', planetaX, planetaY - planetaR - 40 * s);

            // Nave espacial
            const naveX = W * 0.25 + Math.sin(juego.naveAnim * 0.5) * 30 * s;
            const naveY = H * 0.5 + Math.sin(juego.naveAnim * 0.7) * 20 * s;
            const naveEscala = 1 + Math.sin(juego.naveAnim * 0.3) * 0.05;

            ctx.save();
            ctx.translate(naveX, naveY);
            ctx.scale(naveEscala, naveEscala);

            for (let i = 0; i < 3; i++) {
                const alpha = 0.3 - i * 0.1;
                const size = (15 - i * 4) * s;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = '#FFD93D';
                ctx.beginPath();
                ctx.arc(-30 * s - i * 20 * s, 0, size, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#FF6B6B';
                ctx.beginPath();
                ctx.arc(-35 * s - i * 20 * s, 5 * s, size * 0.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            ctx.shadowColor = 'rgba(100,200,255,0.5)';
            ctx.shadowBlur = 40 * s;
            ctx.fillStyle = '#45B7D1';
            ctx.beginPath();
            ctx.moveTo(30 * s, 0);
            ctx.lineTo(-20 * s, -30 * s);
            ctx.lineTo(-35 * s, -20 * s);
            ctx.lineTo(-35 * s, 20 * s);
            ctx.lineTo(-20 * s, 30 * s);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#4ECDC4';
            ctx.fillRect(-25 * s, -25 * s, -15 * s, 50 * s);
            ctx.fillRect(-15 * s, -25 * s, -15 * s, 50 * s);

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#88CCFF';
            ctx.beginPath();
            ctx.arc(10 * s, 0, 14 * s, 0, Math.PI * 2);
            ctx.fill();
            const skin = getSkinData();
            ctx.fillStyle = skin.color;
            ctx.font = `${28*s}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🐱', 10 * s, 2 * s);

            const doritoVuelta = Math.sin(juego.doritosAnim * 3) * 3 * s;
            ctx.fillStyle = '#FF6B35';
            ctx.shadowColor = 'rgba(255,100,50,0.3)';
            ctx.shadowBlur = 15 * s;
            ctx.beginPath();
            ctx.moveTo(20 * s + doritoVuelta, -6 * s);
            ctx.lineTo(12 * s + doritoVuelta, 6 * s);
            ctx.lineTo(28 * s + doritoVuelta, 6 * s);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.beginPath();
            ctx.arc(20 * s + doritoVuelta, 0, 4 * s, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            if (doritos.length === 0) {
                crearDoritos();
            }

            for (const d of doritos) {
                d.x += d.vx + Math.sin(juego.doritosAnim + d.x * 0.01) * 0.5 * s;
                d.y += d.vy;
                d.vy += 0.02 * s;
                d.rot += d.rotV;
                if (d.y > H + 30 * s) {
                    d.y = -30 * s;
                    d.x = rand(W * 0.1, W * 0.9);
                    d.vy = rand(-2.5, -0.5) * s;
                }
                ctx.save();
                ctx.translate(d.x, d.y);
                ctx.rotate(d.rot);
                ctx.shadowColor = d.color;
                ctx.shadowBlur = 20 * s;
                ctx.fillStyle = d.color;
                ctx.beginPath();
                ctx.moveTo(0, -d.r);
                ctx.lineTo(-d.r * 0.9, d.r * 0.7);
                ctx.lineTo(d.r * 0.9, d.r * 0.7);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.beginPath();
                ctx.arc(-d.r * 0.3, 0, d.r * 0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(d.r * 0.3, d.r * 0.2, d.r * 0.15, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            ctx.shadowBlur = 0;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.fillStyle = '#66FF88';
            ctx.font = `bold ${45*s}px Arial`;
            ctx.shadowColor = 'rgba(100,255,150,0.5)';
            ctx.shadowBlur = 40 * s;
            ctx.fillText('🚀 ¡DE REGRESO A CASA!', W / 2, 60 * s);

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#FFD93D';
            ctx.font = `${24*s}px Arial`;
            ctx.fillText('🐱 El gato marciano llegó a Gatito World', W / 2, 110 * s);

            ctx.fillStyle = '#FFA94D';
            ctx.font = `${22*s}px Arial`;
            ctx.fillText('🍟 "¡Ñam ñam! ¡Doritos espaciales!" 🍟', W / 2, 150 * s);

            ctx.fillStyle = '#fff';
            ctx.font = `${18*s}px Arial`;
            ctx.fillText(`⭐ Puntuación: ${juego.score} | 🪙 Monedas: ${monedas}`, W / 2, H - 120 * s);

            if (juego.score > juego.record) {
                ctx.fillStyle = '#FFD700';
                ctx.font = `bold ${20*s}px Arial`;
                ctx.fillText('🏆 ¡NUEVO RÉCORD MUNDIAL!', W / 2, H - 80 * s);
            }

            const btnX = W / 2 - 100 * s;
            const btnY = H - 50 * s;
            const btnW = 200 * s;
            const btnH = 45 * s;

            ctx.shadowColor = 'rgba(100,255,150,0.3)';
            ctx.shadowBlur = 20 * s;

            const grad = ctx.createLinearGradient(btnX, btnY, btnX, btnY + btnH);
            grad.addColorStop(0, '#33CC55');
            grad.addColorStop(1, '#1A8C33');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.roundRect(btnX, btnY, btnW, btnH, 12);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${18*s}px Arial`;
            ctx.fillText('🔄 JUGAR DE NUEVO', W / 2, btnY + btnH / 2);

            const handler = () => {
                canvas.removeEventListener('click', handler);
                canvas.removeEventListener('touchstart', handler);
                juego.victoria = false;
                doritos = [];
                juego.menu = true;
            };
            canvas.addEventListener('click', handler);
            canvas.addEventListener('touchstart', handler);
        }

        // ============================================================
        // MENÚ PRINCIPAL CON TIENDA
        // ============================================================
        function dibujarMenu() {
            const s = S;
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, W, H);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.shadowColor = 'rgba(100,255,150,0.3)';
            ctx.shadowBlur = 40 * s;
            ctx.fillStyle = '#66FF88';
            ctx.font = `bold ${50*s}px Arial`;
            ctx.fillText('🐱 GATO MARCIANO', W / 2, 80 * s);

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#88ccff';
            ctx.font = `${18*s}px Arial`;
            ctx.fillText('🚀 Ayuda al gato a llegar a su nave', W / 2, 135 * s);

            // Mostrar monedas
            ctx.fillStyle = '#FFD700';
            ctx.font = `bold ${20*s}px Arial`;
            ctx.fillText(`🪙 ${monedas} monedas`, W / 2, 180 * s);

            // Skin actual
            const skinActualData = getSkinData();
            ctx.fillStyle = '#aaa';
            ctx.font = `${14*s}px Arial`;
            ctx.fillText(`Skin actual: ${skinActualData.nombre}`, W / 2, 215 * s);

            // Botones
            const btnW = 180 * s;
            const btnH = 45 * s;
            const espaciado = 20 * s;

            // Botón JUGAR
            const btnJugarX = W / 2 - btnW / 2;
            const btnJugarY = 250 * s;

            ctx.shadowColor = 'rgba(100,255,150,0.3)';
            ctx.shadowBlur = 20 * s;

            const gradJugar = ctx.createLinearGradient(btnJugarX, btnJugarY, btnJugarX, btnJugarY + btnH);
            gradJugar.addColorStop(0, '#33CC55');
            gradJugar.addColorStop(1, '#1A8C33');
            ctx.fillStyle = gradJugar;
            ctx.beginPath();
            ctx.roundRect(btnJugarX, btnJugarY, btnW, btnH, 12);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${20*s}px Arial`;
            ctx.fillText('▶ JUGAR', W / 2, btnJugarY + btnH / 2);

            // Botón TIENDA
            const btnTiendaX = W / 2 - btnW / 2;
            const btnTiendaY = btnJugarY + btnH + espaciado;

            const gradTienda = ctx.createLinearGradient(btnTiendaX, btnTiendaY, btnTiendaX, btnTiendaY + btnH);
            gradTienda.addColorStop(0, '#4488FF');
            gradTienda.addColorStop(1, '#0044AA');
            ctx.fillStyle = gradTienda;
            ctx.beginPath();
            ctx.roundRect(btnTiendaX, btnTiendaY, btnW, btnH, 12);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${20*s}px Arial`;
            ctx.fillText('🛒 TIENDA', W / 2, btnTiendaY + btnH / 2);

            // Récord
            if (juego.record > 0) {
                ctx.fillStyle = '#FFD700';
                ctx.font = `${16*s}px Arial`;
                ctx.fillText(`🏆 Récord: ${juego.record}`, W / 2, btnTiendaY + btnH + 30 * s);
            }

            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.font = `${11*s}px Arial`;
            ctx.fillText('🐱 Cada obstáculo = 1 moneda', W / 2, H - 30 * s);

            // Handlers
            if (juego.menu && !juego.tienda) {
                const handlerClick = (e) => {
                    const rect = canvas.getBoundingClientRect();
                    let x, y;
                    if (e.type === 'touchstart') {
                        const touch = e.touches[0];
                        x = touch.clientX - rect.left;
                        y = touch.clientY - rect.top;
                        e.preventDefault();
                    } else {
                        x = e.clientX - rect.left;
                        y = e.clientY - rect.top;
                    }

                    // Botón JUGAR
                    if (x > btnJugarX && x < btnJugarX + btnW &&
                        y > btnJugarY && y < btnJugarY + btnH) {
                        juego.menu = false;
                        canvas.removeEventListener('click', handlerClick);
                        canvas.removeEventListener('touchstart', handlerClick);
                        reiniciarJuego();
                        return;
                    }

                    // Botón TIENDA
                    if (x > btnTiendaX && x < btnTiendaX + btnW &&
                        y > btnTiendaY && y < btnTiendaY + btnH) {
                        juego.tienda = true;
                        juego.menu = false;
                        canvas.removeEventListener('click', handlerClick);
                        canvas.removeEventListener('touchstart', handlerClick);
                    }
                };
                canvas.addEventListener('click', handlerClick);
                canvas.addEventListener('touchstart', handlerClick);
            }
        }

        // ============================================================
        // TIENDA DE SKINS
        // ============================================================
        function dibujarTienda() {
            const s = S;
            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            ctx.fillRect(0, 0, W, H);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.shadowColor = 'rgba(100,255,150,0.3)';
            ctx.shadowBlur = 30 * s;
            ctx.fillStyle = '#FFD700';
            ctx.font = `bold ${40*s}px Arial`;
            ctx.fillText('🛒 TIENDA DE SKINS', W / 2, 60 * s);

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.font = `${20*s}px Arial`;
            ctx.fillText(`🪙 Monedas: ${monedas}`, W / 2, 110 * s);

            // Mostrar skins
            const skinWidth = W * 0.22;
            const skinHeight = 150 * s;
            const totalWidth = SKINS.length * skinWidth + (SKINS.length - 1) * 15 * s;
            const startX = (W - totalWidth) / 2;
            const startY = 150 * s;

            for (let i = 0; i < SKINS.length; i++) {
                const skin = SKINS[i];
                const x = startX + i * (skinWidth + 15 * s);
                const y = startY;

                // Fondo de la skin
                ctx.shadowColor = 'rgba(255,255,255,0.1)';
                ctx.shadowBlur = 10 * s;
                ctx.fillStyle = skin.desbloqueado ? 'rgba(255,255,255,0.08)' : 'rgba(50,50,50,0.3)';
                ctx.beginPath();
                ctx.roundRect(x, y, skinWidth, skinHeight, 10);
                ctx.fill();

                // Borde si está seleccionada
                if (skin.id === skinActual) {
                    ctx.strokeStyle = '#FFD700';
                    ctx.lineWidth = 3 * s;
                    ctx.beginPath();
                    ctx.roundRect(x, y, skinWidth, skinHeight, 10);
                    ctx.stroke();
                }

                ctx.shadowBlur = 0;

                // Color de la skin
                ctx.fillStyle = skin.color;
                ctx.font = `${35*s}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🐱', x + skinWidth / 2, y + 45 * s);

                // Nombre
                ctx.fillStyle = '#fff';
                ctx.font = `${12*s}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(skin.nombre, x + skinWidth / 2, y + 85 * s);

                // Estado
                if (skin.desbloqueado) {
                    if (skin.id === skinActual) {
                        ctx.fillStyle = '#4CAF50';
                        ctx.font = `bold ${12*s}px Arial`;
                        ctx.fillText('✓ SELECCIONADO', x + skinWidth / 2, y + 110 * s);
                    } else {
                        ctx.fillStyle = '#4CAF50';
                        ctx.font = `${12*s}px Arial`;
                        ctx.fillText('✅ Desbloqueado', x + skinWidth / 2, y + 110 * s);
                        // Botón seleccionar
                        const btnSelX = x + skinWidth / 2 - 40 * s;
                        const btnSelY = y + 125 * s;
                        const btnSelW = 80 * s;
                        const btnSelH = 25 * s;
                        ctx.fillStyle = '#4488FF';
                        ctx.beginPath();
                        ctx.roundRect(btnSelX, btnSelY, btnSelW, btnSelH, 8);
                        ctx.fill();
                        ctx.fillStyle = '#fff';
                        ctx.font = `bold ${9*s}px Arial`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('USAR', x + skinWidth / 2, btnSelY + btnSelH / 2);
                    }
                } else {
                    ctx.fillStyle = '#FF6B6B';
                    ctx.font = `${12*s}px Arial`;
                    ctx.fillText(`🔒 ${skin.precio} monedas`, x + skinWidth / 2, y + 110 * s);
                    // Botón comprar
                    const btnComX = x + skinWidth / 2 - 40 * s;
                    const btnComY = y + 125 * s;
                    const btnComW = 80 * s;
                    const btnComH = 25 * s;
                    ctx.fillStyle = monedas >= skin.precio ? '#4CAF50' : '#666';
                    ctx.beginPath();
                    ctx.roundRect(btnComX, btnComY, btnComW, btnComH, 8);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.font = `bold ${9*s}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('COMPRAR', x + skinWidth / 2, btnComY + btnComH / 2);
                }
            }

            // Botón VOLVER
            const btnVolverX = W / 2 - 80 * s;
            const btnVolverY = startY + skinHeight + 30 * s;
            const btnVolverW = 160 * s;
            const btnVolverH = 40 * s;

            ctx.shadowColor = 'rgba(255,255,255,0.1)';
            ctx.shadowBlur = 10 * s;
            ctx.fillStyle = '#555';
            ctx.beginPath();
            ctx.roundRect(btnVolverX, btnVolverY, btnVolverW, btnVolverH, 10);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${18*s}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🔙 VOLVER', W / 2, btnVolverY + btnVolverH / 2);

            // Handlers de la tienda
            const handlerTienda = (e) => {
                const rect = canvas.getBoundingClientRect();
                let x, y;
                if (e.type === 'touchstart') {
                    const touch = e.touches[0];
                    x = touch.clientX - rect.left;
                    y = touch.clientY - rect.top;
                    e.preventDefault();
                } else {
                    x = e.clientX - rect.left;
                    y = e.clientY - rect.top;
                }

                // Botón VOLVER
                if (x > btnVolverX && x < btnVolverX + btnVolverW &&
                    y > btnVolverY && y < btnVolverY + btnVolverH) {
                    juego.tienda = false;
                    juego.menu = true;
                    canvas.removeEventListener('click', handlerTienda);
                    canvas.removeEventListener('touchstart', handlerTienda);
                    return;
                }

                // Verificar clics en skins
                for (let i = 0; i < SKINS.length; i++) {
                    const skin = SKINS[i];
                    const sx = startX + i * (skinWidth + 15 * s);
                    const sy = startY;

                    // Botón USAR o COMPRAR
                    const btnY2 = sy + 125 * s;
                    const btnX2 = sx + skinWidth / 2 - 40 * s;
                    const btnW2 = 80 * s;
                    const btnH2 = 25 * s;

                    if (x > btnX2 && x < btnX2 + btnW2 &&
                        y > btnY2 && y < btnY2 + btnH2) {
                        if (skin.desbloqueado && skin.id !== skinActual) {
                            seleccionarSkin(skin.id);
                            // Actualizar gato si está en juego
                            if (gato) {
                                const newSkin = getSkinData();
                                gato.color1 = newSkin.color;
                                gato.color2 = newSkin.color2;
                                gato.color3 = newSkin.color3;
                            }
                        } else if (!skin.desbloqueado) {
                            if (desbloquearSkin(skin.id)) {
                                // Actualizar gato si está en juego
                                if (gato) {
                                    const newSkin = getSkinData();
                                    gato.color1 = newSkin.color;
                                    gato.color2 = newSkin.color2;
                                    gato.color3 = newSkin.color3;
                                }
                            }
                        }
                        // Redibujar la tienda
                        dibujarTienda();
                        return;
                    }
                }
            };

            canvas.addEventListener('click', handlerTienda);
            canvas.addEventListener('touchstart', handlerTienda);
        }

        // ============================================================
        // DIBUJO DE GAME OVER
        // ============================================================
        function dibujarGameOver() {
            const s = S;
            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.fillRect(0, 0, W, H);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.fillStyle = '#FF1744';
            ctx.font = `bold ${55*s}px Arial`;
            ctx.shadowColor = 'rgba(255,0,0,0.3)';
            ctx.shadowBlur = 30 * s;
            ctx.fillText('💥 GAME OVER', W / 2, 120 * s);

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.font = `${28*s}px Arial`;
            ctx.fillText(`Puntos: ${juego.score}`, W / 2, 185 * s);

            ctx.fillStyle = '#FFD700';
            ctx.font = `${24*s}px Arial`;
            ctx.fillText(`🪙 Monedas ganadas: ${juego.score}`, W / 2, 230 * s);

            if (juego.score > juego.record) {
                juego.record = juego.score;
                localStorage.setItem('spaceCatRecord', String(juego.record));
                ctx.fillStyle = '#FFD700';
                ctx.font = `bold ${22*s}px Arial`;
                ctx.fillText('🏆 ¡NUEVO RÉCORD!', W / 2, 280 * s);
            } else {
                ctx.fillStyle = '#aaa';
                ctx.font = `${18*s}px Arial`;
                ctx.fillText(`Récord: ${juego.record}`, W / 2, 280 * s);
            }

            const btnX = W / 2 - 100 * s;
            const btnY = 330 * s;
            const btnW = 200 * s;
            const btnH = 50 * s;

            ctx.shadowColor = 'rgba(100,255,150,0.3)';
            ctx.shadowBlur = 20 * s;

            const grad = ctx.createLinearGradient(btnX, btnY, btnX, btnY + btnH);
            grad.addColorStop(0, '#33CC55');
            grad.addColorStop(1, '#1A8C33');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.roundRect(btnX, btnY, btnW, btnH, 12);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${20*s}px Arial`;
            ctx.fillText('🔄 REINTENTAR', W / 2, btnY + btnH / 2);

            const handler = () => {
                canvas.removeEventListener('click', handler);
                canvas.removeEventListener('touchstart', handler);
                juego.gameOver = false;
                juego.menu = true;
            };
            canvas.addEventListener('click', handler);
            canvas.addEventListener('touchstart', handler);
        }

        // ============================================================
        // DIBUJADO PRINCIPAL
        // ============================================================
        function dibujar() {
            const s = S;
            ctx.clearRect(0, 0, W, H);

            const grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 1.2);
            grad.addColorStop(0, '#0a0a2a');
            grad.addColorStop(0.5, '#05051a');
            grad.addColorStop(1, '#000008');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            dibujarEstrellas();

            ctx.globalAlpha = 0.04;
            for (let i = 0; i < 4; i++) {
                const grad2 = ctx.createRadialGradient(
                    W * (0.1 + i * 0.27), H * (0.2 + i * 0.2), 0,
                    W * (0.1 + i * 0.27), H * (0.2 + i * 0.2), W * 0.5
                );
                const colores = ['#4ECDC4', '#FF6B6B', '#45B7D1', '#B388FF'];
                grad2.addColorStop(0, colores[i % 4]);
                grad2.addColorStop(1, 'transparent');
                ctx.fillStyle = grad2;
                ctx.fillRect(0, 0, W, H);
            }
            ctx.globalAlpha = 1;

            ctx.strokeStyle = 'rgba(255,255,255,0.04)';
            ctx.lineWidth = 2 * s;
            ctx.setLineDash([8 * s, 15 * s]);
            const espacioTotal = H - 100 * s;
            const altoCarril = espacioTotal / 3;
            for (let i = 1; i < 3; i++) {
                const y = 50 * s + i * altoCarril;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke();
            }
            ctx.setLineDash([]);

            if (juego.faseDificil && juego.jugando) {
                ctx.fillStyle = 'rgba(255,0,0,0.04)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = 'rgba(255,0,0,0.25)';
                ctx.font = `bold ${26*s}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText('⚡ ¡FASE EXTREMA! ⚡', W / 2, 8 * s);
            }

            for (const obs of obstaculos) {
                obs.dibujar();
            }

            if (gato) gato.dibujar();
            dibujarParticulas();

            if (juego.menu && !juego.tienda) dibujarMenu();
            if (juego.tienda) dibujarTienda();
            if (juego.gameOver) dibujarGameOver();
            if (juego.victoria) dibujarVictoria();

            // Mostrar monedas en el juego
            if (juego.jugando && !juego.gameOver && !juego.victoria) {
                ctx.fillStyle = '#FFD700';
                ctx.font = `${14*s}px Arial`;
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.fillText(`🪙 ${monedas}`, W - 20 * s, H - 20 * s);
            }
        }

        // ============================================================
        // EVENTOS
        // ============================================================
        document.addEventListener('keydown', (e) => {
            const key = e.key;
            if (key === 'ArrowUp' || key === 'w' || key === 'W') {
                e.preventDefault();
                if (gato && juego.jugando) gato.mover(true);
            }
            if (key === 'ArrowDown' || key === 's' || key === 'S') {
                e.preventDefault();
                if (gato && juego.jugando) gato.mover(false);
            }
        });

        document.getElementById('btnUp').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (gato && juego.jugando) gato.mover(true);
        }, { passive: false });
        document.getElementById('btnUp').addEventListener('mousedown', () => {
            if (gato && juego.jugando) gato.mover(true);
        });

        document.getElementById('btnDown').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (gato && juego.jugando) gato.mover(false);
        }, { passive: false });
        document.getElementById('btnDown').addEventListener('mousedown', () => {
            if (gato && juego.jugando) gato.mover(false);
        });

        // ============================================================
        // POLYFILL
        // ============================================================
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                r = typeof r === 'number' ? r : (r || 0);
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                this.closePath();
                return this;
            };
        }

        // ============================================================
        // BUCLE PRINCIPAL
        // ============================================================
        function loop() {
            actualizar();
            dibujar();
            requestAnimationFrame(loop);
        }

        // ============================================================
        // INICIAR
        // ============================================================
        crearEstrellas();
        juego.menu = true;
        loop();
    </script>
</body>
